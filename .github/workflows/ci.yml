name: CI
on: [push, pull_request]
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cs2
          POSTGRES_PASSWORD: ci_only
          POSTGRES_DB: cs2
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U cs2" --health-interval 5s --health-retries 15
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
    env:
      DATABASE_URL: postgresql+psycopg://cs2:ci_only@localhost:5432/cs2
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
      - run: pip install -r apps/api/requirements-dev.txt
      - run: ruff check --config apps/api/pyproject.toml apps/api apps/worker && mypy apps/api/app
      - working-directory: apps/api
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head
          python -m pytest -q
      - name: Start real API for browser tests
        working-directory: apps/api
        run: |
          uvicorn app.main:app --host 127.0.0.1 --port 8000 > /tmp/api.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/readyz; then exit 0; fi
            sleep 1
          done
          cat /tmp/api.log
          exit 1
      - run: pnpm --filter cs2-market-web exec playwright install --with-deps chromium
      - run: pnpm --filter cs2-market-web test:e2e
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and start entire stack
        run: |
          export POSTGRES_PASSWORD="$(openssl rand -hex 32)"
          export IMPORT_TOKEN="$(openssl rand -hex 32)"
          docker compose up --build --wait --wait-timeout 240
          curl --fail --retry 5 http://localhost:8000/healthz
          curl --fail http://localhost:8000/readyz
          curl --fail http://localhost:8000/docs
          curl --fail http://localhost:3000/items
          docker compose exec -T api alembic current
          docker compose exec -T redis redis-cli get cs2:worker:heartbeat
      - name: Logs
        if: failure()
        run: docker compose logs --no-color
        env:
          POSTGRES_PASSWORD: diagnostics-placeholder
      - name: Cleanup
        if: always()
        run: docker compose down -v
        env:
          POSTGRES_PASSWORD: diagnostics-placeholder
