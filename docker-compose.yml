services:
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports: ["3000:3000"]
    environment:
      API_URL: http://api:8000
    depends_on:
      api: {condition: service_healthy}
  api:
    build: ./apps/api
    ports: ["8000:8000"]
    environment:
      DATABASE_URL: postgresql+psycopg://cs2:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/cs2
      REDIS_URL: redis://redis:6379/0
      IMPORT_TOKEN: ${IMPORT_TOKEN:-}
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/readyz')"]
      interval: 10s
      timeout: 5s
      retries: 10
  worker:
    build: ./apps/api
    command: ["python", "/worker/main.py"]
    volumes: ["./apps/worker:/worker:ro"]
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      api: {condition: service_healthy}
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: cs2
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: cs2
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cs2 -d cs2"]
      interval: 5s
      retries: 15
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 15
volumes:
  postgres_data:
